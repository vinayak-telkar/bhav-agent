[project]
name = "bhav-agent-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    # Pinned during the M0 spike (specs/02_langgraph_mcp_spike.md, 2026-08-02) against
    # each package's live PyPI resolution. Do not float to "latest" mid-build — this
    # stack has had breaking changes between minor versions (tech spec §11).
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "langchain-mcp-adapters==0.3.1",
    "langchain-groq==1.1.3",
    "langchain-cerebras==0.8.2",   # confirmed to exist under this name (spike, 2026-08-02)
    # mcp must stay <2.0.0: mcp 2.0.0 removed `RequestContext` from
    # mcp.shared.context, which langchain-mcp-adapters 0.3.1 still imports.
    # Confirmed broken/fixed combination in the M0 spike — re-check both pins
    # together if either package is ever bumped.
    "mcp==1.29.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "agent", "ingest", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
